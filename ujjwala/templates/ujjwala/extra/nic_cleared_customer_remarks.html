{% extends "material/frontend/base_module.html" %}
{% load static %}
{% load material_form %}
{% include 'material/includes/material_css.html' %}
{% include 'material/includes/material_js.html' %}
{% block content %}
<link rel="stylesheet" href="{% static '/css/style.css' %}" >
<link href="https://fonts.googleapis.com/css?family=Muli:400,500,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
<div class="p-2 pt-0 form_label" style="width: 100%;">
    <form method="POST">
    {% csrf_token %}
    <div class="card">
        <div class="card-body">
            {% form form=form %}{% endform %}
        </div>
        <div class="card-footer ">
            <button type="submit" name="_submit" class="btn float-right">Submit</button>
        </div>
    </div>
    
    
</div>
</form>
{% endblock %}
