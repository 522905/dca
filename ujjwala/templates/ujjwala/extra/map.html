<style>
    body, html, #map { height: 100%; margin: 0 }
.map {
    position: relative;
}

.map:after {
    width: 22px;
    height: 40px;
    display: block;
    content: ' ';
    position: absolute;
    top: 50%; left: 50%;
    margin: -40px 0 0 -11px;
    background: url('https://maps.gstatic.com/mapfiles/api-3/images/spotlight-poi_hdpi.png');
    background-size: 22px 40px; /* Since I used the HiDPI marker version this compensates for the 2x size */
    pointer-events: none; /* This disables clicks on the marker. Not fully supported by all major browsers, though */
}
</style>

<script>
window.map_obj = undefined;
function initMap(lat, lng, accuracy) {
    document.getElementById("map").classList.add("map");
    var mapOptions = {
        zoom: 14,
        center: new google.maps.LatLng(lat, lng),
        mapTypeId: google.maps.MapTypeId.ROADMAP
    };
    map_obj = new google.maps.Map(document.getElementById('map'), mapOptions);
}
{#google.maps.event.addDomListener(window, 'load', initialize);#}
</script>
<div style="width: 100%;height: 250px" id="map"></div>
