{% extends "material/frontend/base_module.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static '/css/style.css' %}" >
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://releases.transloadit.com/uppy/v2.13.1/uppy.min.css">
<script src="https://releases.transloadit.com/uppy/v2.13.1/uppy.min.js"></script>
<style>

    .hidden-field{ display: none;}
    .form_label .card{ width: 100%;  }
    .address_form label{ margin-bottom: 5px; }
    #address_form .form_block input{ padding-left:5px; border-radius: 3px; border: 1px solid #ccc; width: 100%; line-height: 40px; }
    .form_block label{ float: left; width: 100%; }
    #id_request_video_url {display: none;}
    #id_phone_number{ border: 1px solid #ccc;}
    #videoContainer {
      width: 100%; /* Set your desired width */
      height: 400px; /* Set your desired height */
    }
    .uppy-Webcam-footer{ 
        padding: 5px !important; 
        min-height: 20px;
    }
    .uppy-Webcam-buttonContainer {
        margin-left: 0%;
        text-align: center;
        width: 100%;
    }
    .uppy-Webcam-recordingLength {
        position: absolute;
        /* top: 0; */
        bottom: 19px;
        right: 11px;
    }
    .uppy-DashboardContent-bar{     height: 25px;}
    .uppy-DashboardContent-title{ left:25px; font-size: 10px; top: -7px;}
</style>
<div id="address_form" class="row m-0 form_label p-2">
    <div class="card card-profile pt-0 mt-0 " style="width: 100%;" >
		<div class="row justify-content-center m-0" style="width: 100%; margin: 0 auto !important; padding: 10px;">
			<div style="width: 30%; float:left">
				<div class="card-profile-image">
					<a href="#">
						<img style="width:100%; max-height: 150px;" src="{{obj.document_self}}">
					</a>
				</div>
			</div>
			<div style="width: 70%; float:right">
				<div class="card-body pt-0">
					<div class="text-center">
						<h5 class="h3">{{ obj.name }}({{ obj.id }})<span class="font-weight-light"></span></h5>
						<div class="h5 font-weight-300">
							<i class="ni location_pin mr-2"></i>{{ obj.contact_mobile }}
						</div>
						<div class="h5 mt-1" style=" word-wrap: break-word; font-size: 13px;">
							{{ obj.formatted_address }}
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
    <div class="card address_form">
        <form id="form" method="POST" class="p-2">
            {% csrf_token %}
            {{ form }}
            <div id="uppy"></div>
            <div class="card-footer">
                <input class="btn btn-success rounded-3" type="submit" value="Submit">
            </div>
           
        </form>

    </div>
</div>
<style>ef
    #id_mobile input{
        position: relative ;
        opacity: 1;
    }
    .uppy-Dashboard-inner {
        position: relative;
        max-width: 100%; /* no !important */
        max-height: 100%; /* no !important */
        min-height: 400px;
        outline: none;
        border-radius: 5px;
    }
    .uppy-Dashboard{ height: 400px !important;}
</style>
<script>
     window.mobileChangeVideouppy = new Uppy.Core({
        debug: true,
        autoProceed: true,
        restrictions: {
            maxFileSize: 50000000,
            maxNumberOfFiles: 1,
            minNumberOfFiles: 1
        }
    })
    .use(Uppy.Dashboard, {
        // trigger: '#uppy',
        inline: true,
        target: '#uppy',
        // showProgressDetails: true,
        // note: 'upload video',
        height: 200,
        maxHeight: 200
        // metaFields: [],
        // id: 'uppy',
        // browserBackButtonClose: false
    })
    .use(Uppy.Tus, {
        endpoint: 'https://tus.dca.arungas.com/files/',
    })
    .use(Uppy.Webcam, {  
        modes: ['video-audio'],
        facingMode: 'environment',
        mirror: false,
        target: Uppy.Dashboard,
        mobileNativeCamera: true,
        countdown: true,
        videoConstraints: {
            // height: { min: 720, max: 1920, ideal: 720 }
            width: { min: 640, ideal: 1920, max: 1920 },
            height: { min: 360, ideal: 1080, max: 1080 },
        },
        showRecordingLength: true,
        countdown: true,
        videoConstraints: {
            facingMode: 'user',
        },
    });  
          
    mobileChangeVideouppy.on('complete', result => {
        console.log('successful files:', result.successful)
        console.log('failed files:', result.failed);
        $('[name="request_video_url"]').val(result.successful[0].uploadURL);
    });
</script>
{% endblock %}
