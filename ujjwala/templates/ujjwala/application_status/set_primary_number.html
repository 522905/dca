{% extends "material/frontend/base_module.html" %}
{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static '/css/style.css' %}" >
    <link href="https://fonts.googleapis.com/css?family=Muli:400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
    <style>
        body, .btn{ font-family: 'muli', sans-serif !important; font-weight: 500;}
        .hidden-field{ display: none;}
        .delete {  font-family: 'muli', sans-serif !important; background-color: red; border: 0; color: #fff; font-weight: 500; border-radius: 5px;padding: 6px; width: 85px;font-size: 15px;text-transform: uppercase;}
        #safety_audio_form audio{ padding: 10px 0 0 0; }
        #playAudio p{ padding-left: 10px; font-size: 16px; font-weight: 600;}
        .btns{ font-family: 'muli', sans-serif !important; font-weight: 500; width: 100%; line-height: 0.5;}
        .main-controls canvas{ width: 100%; border-radius: 20px; height: 42px; opacity: 0.4;}
    </style>
    <div class="main p-2 pt-0 form_label">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form }}
                    <input class="btn btn-success rounded-3" type="submit" value="Submit">
                </form>
            </div>
        </div>
    </div>
    <style>
        #id_mobile input{
            position: relative ;
            opacity: 1;
        }
    </style>
{% endblock %}
