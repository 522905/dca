{% extends "material/frontend/base_module.html" %}
{% load static %}
{% load material_form %}
{% block content %}
<link rel="stylesheet" href="{% static '/css/style.css' %}" >
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
    rel="stylesheet">
<style>
    p{ margin:0;}
    #select_number_for_otp .radio-field .col{ flex: none; }
    .user_profile img{ height:100px; }
    .user_profile{margin: 0 auto;display: block;text-align: center;}
    .username{ font-size:15px; font-weight:600; color:#ff5c6c !important;}
    .user_address{ font-size:12px; font-weight:500}
</style> 
<div class="main p-2 pt-0 form_label" id="select_number_for_otp">
    <form method="post" id="">
        {% csrf_token %}
            <div class="card-body ">
                {{ form }}
            </div>
            <div class="card-footer float-right border-top">
                <input class="btn btn-success float-right rounded-0" type="submit" value="Submit" />
            </div>
        </div>
    </form>
</div>
{% endblock %}
