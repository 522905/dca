<div class="card card-profile pt-0 mt-0 " style="width: 100%;" >
    <div class="row justify-content-center m-0" style="margin: 0 auto !important; padding: 10px; border-bottom: 1px solid #ccc; margin-bottom: 5px !important;">
        <div style="width:50%; float:left">
            <div class="card-profile-image">
                <a href="#">
                    <img style="width:100%; height: 200px; object-fit: contain;" src="{{obj.parent.document_self}}">
                </a>
            </div>
        </div>
        <div style="width:50%; float:right">
            <div class="card-body pt-0 p-1">
                <div class="text-center">
                    <h5 class="h4">{{ obj.parent.name }}({{ obj.parent.id }})<span class="font-weight-light"></span></h5>
                    <div class="h5 font-weight-300">
                        <i class="ni location_pin mr-2"></i>{{ obj.parent.contact_mobile }}
                    </div>
                    <div class="h5 mt-1" style=" word-wrap: break-word; font-size: 13px;">
                        {{ obj.parent.formatted_address }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
