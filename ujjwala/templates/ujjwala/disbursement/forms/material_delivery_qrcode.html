<div class="p-2 pt-0 form_label" style="width: 100%;">
    <div class="main-header bg-heading mb-2">
		<span class="text-white text">Material Delivery QR Code</span>
	</div>
    <div class="card p-2">
        {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-info alert-dismissable">
            <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
            {{msg.message}}
          </div>
        {% endfor %}
      {% endif %}
      
      <h5>Booking Id: {{ booking_id }}</h5>
      <img style="max-width: 100px;" src="https://chart.googleapis.com/chart?cht=qr&chs=250x250&chld=L|0&chl={{ booking_id }}"/>
    </div>
    <div class="card-footer">
        <a class="text-white btn btn-danger mb-3 float-left" href="{% url 'ujjwala:first_cylinder_delivery_list' %}" >
            <i class="material-icons">keyboard_backspace</i> BACK
        </a>
    </div>
</div>
