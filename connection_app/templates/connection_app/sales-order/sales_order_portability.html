{% extends "material/frontend/base_module.html" %}
{% load static %}
{% load material_form %}
{% block page_title %}Sales Order Portability - {{ user.first_name }} {{ user.last_name }}{% endblock %}
{% block content %}
    <link rel="stylesheet" href="{% static '/css/style.css' %}" >
    <link href="https://fonts.googleapis.com/css?family=Muli:400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <form method="post">
        <div class="p-2 pt-0 form_label" style="width: 100%;">
            <div class="card">
                <div class="card-body">
                     {% form form=form %}{% endform %}
                </div>
                <div class="card-footer p-2">
                    <input class="btn btn-primary rounded-3 float-right" type="submit"  value="Submit"/>
                </div>
{#                <div class="card-footer">#}
{#                    <input name="show_hidden_rec" type="submit" value="Submit">#}
{#                </div>#}
            </div>
        </div>
    </form>
{% endblock %}
