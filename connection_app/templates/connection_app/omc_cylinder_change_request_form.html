{% extends "material/frontend/base_module.html" %}
{% load static %}
{% block page_title %}Promotional Sale{% endblock %}
{% load material_form %}
{% block content %}
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <link rel="stylesheet" href="https://releases.transloadit.com/uppy/v2.13.1/uppy.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <script src="https://releases.transloadit.com/uppy/v2.13.1/uppy.min.js"></script>

	<div class="container mt-4 main p-2 pt-0 form_label">
		<form method="post" id="promotional-sale-form">
			{% csrf_token %}
			<div class="card">
				<div class="card-header bg-primary text-white">OMC Cylinder Conversion Form</div>
				<div class="card-body">
					{% form form=form %}{% endform %}
					<input type="hidden" id="id_omccylinderphotoBefore" name="omccylinderphotoBefore">
					<input type="hidden" id="id_omccylinderphotoAfter" name="omccylinderphotoAfter">
		
					<div class="row">
						<div class="col-md-6">
							<label><strong>OMC Cylinder Photo Before</strong></label>
							<div id="omccylinderphotoBefore" class="border p-2"></div>
						</div>
						<div class="col-md-6">
							<label><strong>OMC Cylinder Photo With Person</strong></label>
							<div id="omccylinderphotoAfter" class="border p-2"></div>
						</div>
						<input type="hidden" id="id_omccylinderphotoBefore" name="omccylinderphotoBefore">
						<input type="hidden" id="id_omccylinderphotoAfter" name="omccylinderphotoAfter">
					</div>
				</div>
				<div class="card-footer text-end">
					<button type="submit" class="btn btn-success float-end rounded-0">Submit</button>
				</div>
			</div>
		</form>
		<div id="submissionAlert" class="alert alert-success text-center" role="alert" style="display: none;">
			✅ Form Submitted Successfully!
		</div>
	</div>
	
	<script>
		document.getElementById("promotional-sale-form").addEventListener("submit", function(e) {
			e.preventDefault();
	
			const form = e.target;
			const formData = new FormData(form);
	
			fetch("", {
				method: "POST",
				body: formData,
				headers: {
					'X-Requested-With': 'XMLHttpRequest',
				}
			})
			.then(response => {
				if (response.ok) {
					return response.text();
				} else {
					throw new Error("Network response was not ok");
				}
			})
			.then(data => {
				console.log("Server response:", data);
				document.getElementById("submissionAlert").style.display = "block";
				setTimeout(() => {
					document.getElementById("submissionAlert").style.display = "none";
				}, 3000);
			})
			.catch(error => {
				alert("Error submitting form: " + error);
			});
		});
	</script>
	<script>
		// Uppy instance for omccylinderphotoAfter
		const uppyAfter = new Uppy.Core({
			debug: true,
			autoProceed: true,
			restrictions: {
				maxFileSize: 50000000,
				maxNumberOfFiles: 1,
				allowedFileTypes: ['image/*'],
			}
		})
		.use(Uppy.Dashboard, {
			trigger: '#omccylinderphotoAfter',
			inline: true,
			target: '#omccylinderphotoAfter',
			showProgressDetails: true,
			note: 'Upload one image (max 50MB)',
			height: 250,
			browserBackButtonClose: false
		})
		.use(Uppy.Tus, {
			endpoint: 'https://tus.dca.arungas.com/files/',
		})
		.use(Uppy.Compressor, {
			quality: 0.9,
			maxWidth: 2048,
			resize: 'contain',
			limit: 10,
			convertTypes: ['image/png', 'image/jpg', 'image/jpeg'],
			convertSize: 1000000,
		});
	
		uppyAfter.on('complete', result => {
			const uploadedURL = result.successful[0]?.uploadURL;
			console.log('After photo uploaded:', uploadedURL);
			if (uploadedURL) {
				document.getElementById("id_omccylinderphotoAfter").value = uploadedURL;
			}
		});
	
		// Uppy instance for omccylinderphotoBefore
		const uppyBefore = new Uppy.Core({
			debug: true,
			autoProceed: true,
			restrictions: {
				maxFileSize: 50000000,
				maxNumberOfFiles: 1,
				allowedFileTypes: ['image/*'],
			}
		})
		.use(Uppy.Dashboard, {
			trigger: '#omccylinderphotoBefore',
			inline: true,
			target: '#omccylinderphotoBefore',
			showProgressDetails: true,
			note: 'Upload one image (max 50MB)',
			height: 250,
			browserBackButtonClose: false
		})
		.use(Uppy.Tus, {
			endpoint: 'https://tus.dca.arungas.com/files/',
		})
		.use(Uppy.Compressor, {
			quality: 0.9,
			maxWidth: 2048,
			resize: 'contain',
			limit: 10,
			convertTypes: ['image/png', 'image/jpg', 'image/jpeg'],
			convertSize: 1000000,
		});
	
		uppyBefore.on('complete', result => {
			const uploadedURL = result.successful[0]?.uploadURL;
			console.log('Before photo uploaded:', uploadedURL);
			if (uploadedURL) {
				document.getElementById("id_omccylinderphotoBefore").value = uploadedURL;
			}
		});
	</script>
{% endblock %}
